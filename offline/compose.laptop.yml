# Laptop-Variante: opencode läuft hier, das LLM auf dem Homelab (OpenWebUI-API).
# Kein internes Netz — der Container muss dein Homelab im LAN erreichen.
# Schutz vor Internet-Egress übernimmt die Code-Sperre (offline-guard):
# private IPs/LAN sind erlaubt, alles andere wird geblockt.
#
# Nutzung:  cp .env.example .env  →  Werte eintragen  →
#           docker compose -f compose.laptop.yml run --rm opencode
services:
  opencode:
    build:
      context: ..
      dockerfile: offline/Dockerfile
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      # Projektordner, auf dem opencode arbeiten soll:
      - ${OPENCODE_WORKSPACE:-./workspace}:/workspace
      # Persistenter State (Sessions, Cache):
      - opencode-home:/root
      - ./opencode.laptop.json:/root/.config/opencode/opencode.json:ro
    environment:
      # OpenAI-kompatible API von OpenWebUI, z.B. http://192.168.1.50:8080/api
      OPENWEBUI_API_URL: ${OPENWEBUI_API_URL:?In offline/.env setzen, z.B. http://192.168.1.50:8080/api}
      # API-Key aus OpenWebUI: Einstellungen → Konto → API-Schlüssel
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:?In offline/.env setzen}
      # Optional: Homelab-Hostname mit Punkt erlauben (z.B. "fritz.box"):
      OPENCODE_ALLOW_HOSTS: ${OPENCODE_ALLOW_HOSTS:-}

volumes:
  opencode-home:
